name: Publish to npm (manual)

# Escape hatch only. The normal path is release-please.yml, whose publish job
# runs when a release is actually created.
#
# This used to trigger on any pushed `v*.*.*` tag, which meant the publish was
# keyed on a tag glob rather than on a release. That glob also matched
# malformed tags — `v1.2.5-corrected` was in this repo and would have matched.
#
# Run this from the Actions tab and pick the tag to publish in the ref selector.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ github.ref_name }} to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
