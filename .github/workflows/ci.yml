name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run linter
        run: npm run lint

  route-check:
    name: Base URLs are routed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - run: npm ci

      # Ask the services, so a base URL change cannot pass unprobed.
      - name: Probe the base URLs the services build
        run: |
          node -e '
            const p = require("./");
            console.log(p.emailService({ apiKey: "route-check" }).baseURL);
            console.log(p.formService({ apiKey: "route-check" }).baseURL);
            // The webhooks base is probed with /endpoints appended. The gateway
            // scopes its rule to that one resource so the producers event-ingest
            // route stays off the public host, which leaves the bare base
            // unrouted by design — probing it directly would fail this check for
            // a URL the service never requests on its own.
            console.log(p.webhookService({ apiKey: "route-check" }).baseURL + "/endpoints");
          ' | .github/scripts/route-check.sh
